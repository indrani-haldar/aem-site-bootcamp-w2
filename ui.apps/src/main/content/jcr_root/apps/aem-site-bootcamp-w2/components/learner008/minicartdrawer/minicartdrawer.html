<section class="cmp-learner008-cart" data-sly-use.model="com.adobe.aem.bootcamp.core.learner008.models.Learner008MiniCartDrawerModel" data-cmp-is="shopfast-cart" data-carts-endpoint="${model.cartsEndpoint}">
    <div class="cmp-learner008-cart__overlay" data-cmp-hook-shopfast-cart="overlay" hidden></div>
    <aside class="cmp-learner008-cart__drawer" data-cmp-hook-shopfast-cart="drawer" hidden role="dialog" aria-modal="true" aria-label="${model.title}">
        <header class="cmp-learner008-cart__header">
            <h2>${model.title}</h2>
            <button type="button" class="cmp-learner008-cart__close" data-cmp-hook-shopfast-cart="close" aria-label="Close cart">x</button>
        </header>
        <div class="cmp-learner008-cart__items" data-cmp-hook-shopfast-cart="items"></div>
        <p class="cmp-learner008-cart__empty" data-cmp-hook-shopfast-cart="empty">${model.emptyLabel}</p>
        <footer class="cmp-learner008-cart__footer">
            <p>Subtotal: <span data-cmp-hook-shopfast-cart="total">$0.00</span></p>
            <button type="button" class="cmp-learner008-cart__checkout">${model.checkoutLabel}</button>
        </footer>
    </aside>
</section>
