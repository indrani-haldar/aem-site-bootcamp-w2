<sly data-sly-use.model="com.adobe.aem.bootcamp.core.learner005.models.HeroModel" />
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.all @ categories='learner005.hero'}"/>

    <div class="${properties.alignment} hero-container" data-cmp-is="hero">
        <div class="hero">
            <div class="cmp-hero__content">
                <h1>${model.heading}</h1>
                <p>${model.subtext}</p>

                <div class="cmp-hero-search">
                    <label for="searchInput" class="sr-only">
                        Search products
                    </label>

                    <input type="text" id="searchInput" placeholder="Search products" 
                        aria-label="Search products">
                    <button type="button" class="cmp-hero-search__btn" id="searchButton" >
                        Submit
                    </button>
                </div>
            </div>
        </div>
    </div>
</sly>
