<section class="form-area" aria-labelledby="contact-form-title">

    <h1 id="contact-form-title">
        ${properties.formTitle}
    </h1>

    <p id="contact-form-description">
        ${properties.formdescription}
    </p>

    <div class="form-body">

        <form id="contact-form" novalidate>

            <div class="form-field">
                <label for="contact-name">
                    ${properties.name}
                </label>

                <input
                    id="contact-name"
                    name="name"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="name"
                    aria-required="true"
                    required />

                <span
                    id="contact-name-error"
                    class="form-error"
                    aria-live="polite">
                </span>
            </div>

            <div class="form-field">
                <label for="contact-email">
                    ${properties.email}
                </label>

                <input
                    id="contact-email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    aria-required="true"
                    required />

                <span
                    id="contact-email-error"
                    class="form-error"
                    aria-live="polite">
                </span>
            </div>

            <div class="form-field">
                <label for="contact-message">
                    ${properties.message}
                </label>

                <textarea
                    id="contact-message"
                    name="message"
                    placeholder="Enter your message"
                    aria-required="true"
                    required></textarea>

                <span
                    id="contact-message-error"
                    class="form-error"
                    aria-live="polite">
                </span>
            </div>

            <button
                type="submit"
                class="submit-btn">
                Submit
            </button>

            <div
                id="form-status"
                class="form-status"
                role="status"
                aria-live="polite">
            </div>

        </form>

    </div>

</section>

<!-- Success Modal -->
<div
    id="successModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalDescription"
    aria-hidden="true">

    <div class="modal__content">
        <div class="modal__icon" aria-hidden="true">
            ✓
        </div>

        <h2 id="modalTitle" class="modal__title">
            Message Sent Successfully
        </h2>

        <p id="modalDescription" class="modal__description">
            Thank you for contacting us. We have received your message and will
            get back to you as soon as possible.
        </p>

        <button
            type="button"
            id="closeModal"
            class="modal__button"
            aria-label="Close success message">
            Close
        </button>
    </div>
</div>
