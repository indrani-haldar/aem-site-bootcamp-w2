<div class="contact-page">
    <section class="contact-section">
        <div class="contact-header">
            <h1 id="contact-title">
                ${properties.title}
            </h1>
            <p>
                ${properties.description}
            </p>
        </div>
        <form class="contact-form" aria-labelledby="contact-title" novalidate>
            <div class="form-group">
                <label for="name">
                    Name
                </label>
                <input id="name" type="text" placeholder="Enter your name" required aria-required="true">
            </div>
            <div class="form-group">
                <label for="email">
                    Email
                </label>
                <input id="email" type="email" class="email-input" placeholder="Enter your email" required
                    aria-required="true" aria-describedby="email-error">
                <span id="email-error" class="email-error" role="alert" aria-live="polite">
                </span>
            </div>
            <div class="form-group">
                <label for="message">
                    Message
                </label>
                <textarea id="message" rows="6" placeholder="Enter your message" required aria-required="true"></textarea>
            </div>
            <button type="submit" class="contact-submit-btn" aria-label="Send Message">
                Send Message
            </button>
        </form>
        <div class="contact-success-modal" role="dialog" aria-modal="true" aria-labelledby="success-title">
            <div class="contact-success-content">
                <div class="success-icon" aria-hidden="true">
                    ✅
                </div>
                <h2 id="success-title">
                    Message Sent Successfully
                </h2>
                <p>
                    Thank you for contacting ShopFast.
                </p>
                <button class="close-contact-modal" aria-label="Close success message">
                    Close
                </button>
            </div>
        </div>
    </section>
</div>
