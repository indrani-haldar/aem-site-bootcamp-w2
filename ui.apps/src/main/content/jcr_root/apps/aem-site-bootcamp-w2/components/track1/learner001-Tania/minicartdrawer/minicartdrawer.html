<aside class="shopfast__cart" id="shopfast-cart" role="dialog" aria-modal="true" aria-labelledby="shopfast-cart-title" aria-hidden="true" data-shopfast-cart>
    <div class="shopfast__cart-header">
        <h2 id="shopfast-cart-title">${properties.cartTitle || 'Your Cart'} (<span data-cart-count>0</span>)</h2>
        <button class="shopfast__cart-close" type="button" aria-label="Close cart">&times;</button>
    </div>
    <div class="shopfast__cart-items" data-cart-items></div>
    <div class="shopfast__cart-footer">
        <div><span>Subtotal</span><strong data-cart-total>$0.00</strong></div>
        <button class="shopfast__checkout" type="button" aria-label="Proceed to checkout with cart contents">${properties.checkoutLabel || 'Checkout'}</button>
    </div>
</aside>
<div class="shopfast__cart-overlay" data-cart-overlay></div>
