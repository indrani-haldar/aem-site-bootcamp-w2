<div data-sly-use.templates="core/wcm/components/commons/v1/templates.html"></div>
<div data-sly-use.model="com.adobe.aem.bootcamp.core.models.ProductDetailHeroModel"
    class="qc-product-detail-hero"
    data-cmp-is="qc-product-detail-hero">

    <sly data-sly-test="${!model.valid}">
        <sly data-sly-call="${templates.placeholder @ isEmpty=true}"></sly>
        <p class="qc-product-detail-hero__error">${model.errorMessage}</p>
    </sly>

    <section data-sly-test="${model.valid}" class="qc-product-detail-hero__content">
        <div class="qc-product-detail-hero__media">
            <img src="${model.image}" alt="${model.title}" loading="lazy" />
        </div>

        <div class="qc-product-detail-hero__body">
            <p class="qc-product-detail-hero__category">${model.category}</p>
            <h1 class="qc-product-detail-hero__title">${model.title}</h1>
            <p class="qc-product-detail-hero__price">${model.priceLabel}</p>

            <div class="qc-product-detail-hero__purchase"
                data-product-id="${model.productId}"
                data-product-title="${model.title}"
                data-product-price="${model.price}"
                data-product-image="${model.image @ context='attribute'}">
                <label for="quickcart-qty-${model.productId}" class="qc-product-detail-hero__qty-label">Quantity</label>
                <div class="qc-product-detail-hero__qty-controls">
                    <button type="button" class="qc-product-detail-hero__qty-btn" data-action="decrement" aria-label="Decrease quantity">-</button>
                    <input id="quickcart-qty-${model.productId}" class="qc-product-detail-hero__qty-input" type="number" min="1" value="1" inputmode="numeric" />
                    <button type="button" class="qc-product-detail-hero__qty-btn" data-action="increment" aria-label="Increase quantity">+</button>
                </div>
                <button type="button" class="qc-product-detail-hero__add-btn" data-action="add-to-cart">${model.addToCartLabel}</button>
                <p class="qc-product-detail-hero__status" aria-live="polite"></p>
            </div>
        </div>
    </section>
</div>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
    data-sly-call="${clientlib.css @ categories='learner009.productdetailhero'}"></sly>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
    data-sly-call="${clientlib.js @ categories='learner009.productdetailhero'}"></sly>
