<div class="shopfast__filters" role="search" data-shopfast-search-filter>
    <label class="shopfast__search-label" for="shopfast-search">Search products</label>
    <input id="shopfast-search" class="shopfast__search" type="search" placeholder="${properties.searchPlaceholder || 'Search products...'}" autocomplete="off">
    <div class="shopfast__categories" aria-label="Product categories">
        <button type="button" class="shopfast__category is-active" data-category="" aria-pressed="true">All</button>
        <button type="button" class="shopfast__category" data-category="beauty" aria-pressed="false">Beauty</button>
        <button type="button" class="shopfast__category" data-category="fragrances" aria-pressed="false">Fragrances</button>
        <button type="button" class="shopfast__category" data-category="smartphones" aria-pressed="false">Smartphones</button>
        <button type="button" class="shopfast__category" data-category="laptops" aria-pressed="false">Laptops</button>
        <button type="button" class="shopfast__category" data-category="groceries" aria-pressed="false">Groceries</button>
    </div>
</div>
