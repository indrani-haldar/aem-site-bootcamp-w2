<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />

<sly data-sly-use.productGrid="com.adobe.aem.bootcamp.core.models.track1.learner002.ProductGridModel" />

<section class="products-section" data-results-url="${resource.path}.product-results.json" id="product-grid">

            &#10095;
